name: Mestag Therapeutics
description: 'Mestag Therapeutics is a clinical-stage immunotherapy company based in Cambridge,
  UK, developing new treatments for cancer and inflammatory diseases by targeting the
  understudied role of activated fibroblasts in immune responses. Its lead cancer program,
  MST-0312, is a targeted LTBR-agonist bispecific antibody designed to drive tertiary
  lymphoid structure (TLS) formation in solid tumors and is now in the Phase I STARLYS
  trial. Its inflammatory-disease program, M402, uses agonist antibodies against stromal
  inhibitory receptors for conditions including rheumatoid arthritis, inflammatory bowel
  disease, and lupus. Backed by GV, Mestag is a privately held biotech and does not
  currently publish a public API, developer portal, or machine-readable API surface.'
